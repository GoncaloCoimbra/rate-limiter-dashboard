services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ratelimiter}
      MYSQL_USER: ${MYSQL_USER:-ratelimiter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ratelimiter_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-ratelimiter}", "-p${MYSQL_PASSWORD:-ratelimiter_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ratelimiter}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ratelimiter}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ratelimiter_pass}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      APP_SECURITY_USERNAME: ${APP_SECURITY_USERNAME:-admin@ratelimiter.local}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:-change-me-please}
      APP_SECURITY_JWT_SECRET: "${APP_SECURITY_JWT_SECRET:?definir no .env}"
      APP_SECURITY_COOKIE_SECURE: ${APP_SECURITY_COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql-data:
