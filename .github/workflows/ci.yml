name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rate_limiter
          MYSQL_USER: rate_limiter
          MYSQL_PASSWORD: rate_limiter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Wait for MySQL
        working-directory: .
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/rate_limiter
          SPRING_DATASOURCE_USERNAME: rate_limiter
          SPRING_DATASOURCE_PASSWORD: rate_limiter
          APP_SECURITY_USERNAME: admin
          APP_SECURITY_PASSWORD: ci-admin-password
          APP_SECURITY_JWT_SECRET: ci-only-secret-with-at-least-32-characters
        run: mvn --batch-mode verify

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless
