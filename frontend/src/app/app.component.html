<ng-container *ngIf="authRoute(); else dashboardShell"><router-outlet /></ng-container>
<ng-template #dashboardShell><main class="app-shell" aria-label="Aplicação principal">
  <app-sidebar />

    <app-topbar />
    <div class="content page-shell"><router-outlet /></div>
    <footer class="app-footer"><div class="footer-left"><div class="footer-brand"><svg width="20" height="20" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#35c8cf" fill-opacity=".15"/><rect x="6" y="14" width="4" height="12" rx="2" fill="#35c8cf"/><rect x="14" y="8" width="4" height="18" rx="2" fill="#35c8cf"/><rect x="22" y="11" width="4" height="15" rx="2" fill="#35c8cf"/></svg><span>ratelimit<span class="footer-cyan">er</span></span></div><span class="footer-sep">·</span><span>© 2026 Todos os direitos reservados</span></div><div class="footer-right"><span class="footer-version">v1.0.0</span><a routerLink="/documentacao" class="footer-link">Documentação</a><a routerLink="/suporte" class="footer-link">Suporte</a></div></footer>

  </section>
