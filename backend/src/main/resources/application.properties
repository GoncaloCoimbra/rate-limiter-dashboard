spring.application.name=rate-limiter-backend
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3308/rate_limiter
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.security.require-auth=${APP_SECURITY_REQUIRE_AUTH:true}
app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:change-me}
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:change-this-development-secret-please-rotate}
app.security.jwt-expiration-ms=${APP_SECURITY_JWT_EXPIRATION_MS:3600000}
